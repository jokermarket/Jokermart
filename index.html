<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKER MARKET</title>
<style>
body{margin:0;font-family:Arial;background:#fff5ef}
header{background:#ff6a00;color:#fff;padding:14px;position:sticky;top:0}
.logo{font-size:24px;font-weight:900;cursor:pointer}
.logo span{background:#fff;color:#111;padding:2px 7px;border-radius:6px}
.search{margin-top:10px;background:#fff;border-radius:20px;display:flex;overflow:hidden}
.search input{flex:1;border:0;padding:11px;outline:0}
.search button{background:#111;color:#fff;border:0;padding:0 15px}
.nav{display:flex;gap:8px;overflow:auto;margin-top:10px}
.nav button{background:#fff;color:#ff6a00;border:0;padding:7px 14px;border-radius:20px;font-weight:700;white-space:nowrap}
.banner{background:linear-gradient(90deg,#ff6a00,#ff9a3d);color:#fff;margin:12px;border-radius:16px;padding:18px}
.banner h1{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ffe0cc}
.card img{width:100%;height:140px;object-fit:cover}
.card div{padding:10px}
.card button{width:100%;padding:9px;border:0;border-radius:8px;margin-top:6px}
.add{background:#ff6a00;color:#fff;font-weight:800}
.box{background:#fff;margin:12px;border-radius:14px;padding:14px}
.box input,.box select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.box button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;margin-top:6px}
.o{background:#ff6a00;color:#fff}.d{background:#111;color:#fff}.r{background:red;color:#fff}.g{background:#25D366;color:#fff}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:99;padding:15px;overflow:auto}
.modal.open{display:block}
.mbox{background:#fff;border-radius:16px;padding:16px;max-width:520px;margin:20px auto}
.stat{display:flex;gap:8px}.stat div{flex:1;background:#fff5ef;padding:12px;border-radius:10px;text-align:center}
.tabs2{display:flex;gap:8px;margin:12px 0}.tabs2 button{flex:1;padding:10px;border:0;border-radius:10px;background:#eee;font-weight:800}.tabs2 button.on{background:#111;color:#fff}
footer{background:#111;color:#fff;text-align:center;padding:18px;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="logo" onclick="tapLogo()">JOKER <span>MARKET</span></div>
<div class
